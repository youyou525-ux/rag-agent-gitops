apiVersion: v1
kind: PersistentVolume
metadata:
  name: milvus-etcd-pv
spec:
  capacity: { storage: 10Gi }
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  hostPath: { path: "/data/milvus-etcd", type: DirectoryOrCreate }
---
