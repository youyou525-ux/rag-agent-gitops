apiVersion: v1
kind: Namespace
metadata:
  name: milvus
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-etcd-pvc
  namespace: milvus
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: milvus-etcd-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-minio-pvc
  namespace: milvus
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: milvus-minio-pv
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-standalone-pvc
  namespace: milvus
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: milvus-standalone-pv
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-etcd
  namespace: milvus
  labels:
    app: milvus-etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus-etcd
  template:
    metadata:
      labels:
        app: milvus-etcd
    spec:
      containers:
      - name: etcd
        image: m.daocloud.io/quay.io/coreos/etcd:v3.5.5
        command: ["etcd"]
        args:
        - "-advertise-client-urls=http://milvus-etcd.milvus:2379"
        - "-listen-client-urls=http://0.0.0.0:2379"
        - "--data-dir=/etcd"
        env:
        - name: ETCD_AUTO_COMPACTION_MODE
          value: "revision"
        - name: ETCD_QUOTA_BACKEND_BYTES
          value: "4294967296"
        volumeMounts:
        - name: etcd-data
          mountPath: /etcd
      volumes:
      - name: etcd-data
        persistentVolumeClaim:
          claimName: milvus-etcd-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-etcd
  namespace: milvus
spec:
  selector:
    app: milvus-etcd
  ports:
  - port: 2379
    targetPort: 2379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-minio
  namespace: milvus
  labels:
    app: milvus-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus-minio
  template:
    metadata:
      labels:
        app: milvus-minio
    spec:
      containers:
      - name: minio
        image: hub.rat.dev/minio/minio:RELEASE.2023-03-20T20-16-18Z
        command: ["minio"]
        args: ["server", "/data", "--console-address=:9001"]
        env:
        - name: MINIO_ROOT_USER
          value: "minioadmin"
        - name: MINIO_ROOT_PASSWORD
          value: "minioadmin"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        persistentVolumeClaim:
          claimName: milvus-minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-minio
  namespace: milvus
spec:
  selector:
    app: milvus-minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus-standalone
  namespace: milvus
  labels:
    app: milvus-standalone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: milvus-standalone
  template:
    metadata:
      labels:
        app: milvus-standalone
    spec:
      containers:
      - name: milvus
        image: hub.rat.dev/milvusdb/milvus:v2.4.17
        command: ["milvus", "run", "standalone"]
        env:
        - name: ETCD_ENDPOINTS
          value: "milvus-etcd:2379"
        - name: MINIO_ADDRESS
          value: "milvus-minio:9000"
        ports:
        - containerPort: 19530
        - containerPort: 9091
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: milvus-data
          mountPath: /var/lib/milvus
      volumes:
      - name: milvus-data
        persistentVolumeClaim:
          claimName: milvus-standalone-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: milvus-standalone
  namespace: milvus
spec:
  type: NodePort
  selector:
    app: milvus-standalone
  ports:
  - name: grpc
    port: 19530
    targetPort: 19530
    nodePort: 30530
  - name: metrics
    port: 9091
    targetPort: 9091
